name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write        # 发布 Release 附件需要写权限

jobs:
  build:
    # 用 22.04 而非 ubuntu-latest：python-for-android 在 24.04 上
    # 常因依赖缺失而报错，22.04 是 CI 里最稳的组合
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 【必须】Gradle 8.0.2 + Android Gradle Plugin 要求 Java 17，
      # 而 GitHub 运行器默认 JAVA_HOME 是 Java 11，gradle 会直接失败：
      #   Android Gradle plugin requires Java 17 to run. You are currently using Java 11.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev
          # 部分版本的 build-tools 仍需要 libtinfo5，缺失时不影响安装流程
          sudo apt-get install -y libtinfo5 || echo "libtinfo5 不可用，跳过"

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 与 buildozer.spec 里 p4a.branch = v2024.01.21 同代的稳定组合
          python -m pip install "cython==0.29.33" "buildozer==1.5.0"

      # `yes |` 自动回答 sdkmanager 的许可协议交互提示，避免 build-tools
      # 因等待输入而没装上（表现为 "Aidl not found"）
      - name: Build debug APK
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fojiao-ai-search-apk
          path: bin/*.apk
          if-no-files-found: error

      # 同时挂到 Release 上：Release 附件公开可下载，便于直接取用
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: latest build
          body: 自动构建产物（debug 签名）
          files: bin/*.apk
